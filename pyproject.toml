[project]
name = "construction-x-ontologies"
version = "0.1.0"
description = "Core ontologies and validation contracts for Construct-X"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4",
    "markdown",
    "rdflib",
    "pyshacl",
    "pyyaml",
    "jinja2",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
norecursedirs = [".git", ".venv", ".uv-cache", "dist", "build", "pytest-cache-files-*"]
